name: SEO Skills AI — Multi-Agent CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Open Agent Skills Portability Check
        run: python scripts/portability_check.py

      - name: Run System Diagnostics Doctor
        run: python scripts/doctor.py

      - name: Execute Enterprise Test Suite
        run: python tests/run_all_tests.py
