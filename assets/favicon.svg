<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Obsidian Background Container with Subtle Border -->
  <rect width="32" height="32" rx="7" fill="#0A0F1D"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Isometric AI Neural Prism -->
  <g transform="translate(4, 4)">
    <!-- Top Face -->
    <polygon points="12,2 21.5,7.5 12,13 2.5,7.5" fill="url(#cyber-grad)" fill-opacity="0.9" stroke="#00E5FF" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Left Face -->
    <polygon points="2.5,7.5 12,13 12,22 2.5,16.5" fill="#0369A1" fill-opacity="0.75" stroke="#00E5FF" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Right Face -->
    <polygon points="12,13 21.5,7.5 21.5,16.5 12,22" fill="#4338CA" fill-opacity="0.8" stroke="#6366F1" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Center Core Node -->
    <circle cx="12" cy="12.5" r="2.2" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="12" cy="12.5" r="1.1" fill="#FFFFFF"/>
  </g>
</svg>