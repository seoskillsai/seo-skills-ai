<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  
  <!-- Icon Lockup -->
  <g transform="translate(2, 4)">
    <polygon points="20,3 36,12.5 20,22 4,12.5" fill="url(#icon-grad)" fill-opacity="0.9" stroke="#00E5FF" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="4,12.5 20,22 20,37 4,27.5" fill="#0284C7" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="20,22 36,12.5 36,27.5 20,37" fill="#4F46E5" fill-opacity="0.85" stroke="#6366F1" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="20" cy="21" r="3" fill="#00E5FF"/>
    <circle cx="20" cy="21" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="50" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="0.06em" fill="url(#text-grad)">SEO SKILLS</text>
  
  <!-- Cybernetic AI Badge -->
  <g transform="translate(195, 14)">
    <rect width="36" height="20" rx="4" fill="url(#badge-grad)" fill-opacity="0.15" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="18" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="0.08em" fill="#00E5FF" text-anchor="middle">AI</text>
  </g>
</svg>